name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Validate Python sources
        run: python -m compileall -q src

      - name: Run tests
        run: pytest -q --disable-warnings --maxfail=1

      - name: Validate sample CLI pipeline and case lifecycle
        run: |
          rm -rf reports/ci
          mkdir -p reports/ci
          python -m ai_soc_copilot.cli \
            --input samples/security_events.jsonl \
            --output reports/ci/incident_report.md \
            --case-json reports/ci/cases.json \
            --case-store reports/ci/case_store.json
          test -s reports/ci/incident_report.md
          test -s reports/ci/cases.json
          test -s reports/ci/case_store.json

          CASE_ID="$(python -c 'import json; print(json.load(open("reports/ci/cases.json", encoding="utf-8"))[0]["case_id"])')"
          python -m ai_soc_copilot.cli --case-action show --case-id "$CASE_ID" --case-store reports/ci/case_store.json
          python -m ai_soc_copilot.cli --case-action status --case-id "$CASE_ID" --status investigating --case-store reports/ci/case_store.json
          python -m ai_soc_copilot.cli --case-action note --case-id "$CASE_ID" --note "CI lifecycle verification" --case-store reports/ci/case_store.json
          python -m ai_soc_copilot.cli --case-action status --case-id "$CASE_ID" --status resolved --case-store reports/ci/case_store.json
          python -m ai_soc_copilot.cli --case-action list --case-store reports/ci/case_store.json

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: reports/ci/
          if-no-files-found: ignore

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit bandit

      - name: Dependency audit
        run: pip-audit

      - name: Bandit security scan
        run: bandit -r src -ll -ii

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
