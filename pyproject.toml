[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-soc-copilot"
version = "0.1.0"
description = "Defensive SOC alert triage assistant with transparent rules and local reporting."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Adam Ghanem" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ai-soc-copilot = "ai_soc_copilot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
